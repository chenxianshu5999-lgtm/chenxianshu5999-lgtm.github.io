<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>交互教程</title>
        <script src="js/konva.js"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #000;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            #game {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                right: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            #game canvas {
                display: block;
                aspect-ratio: 19/10;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>
        <script src="js/game.js"></script>
        <script src="js/fit.js"></script>
        <script>
            let isCtrlPressedA = false;
            const Tutorial = () => {
                return new Promise((resolve, reject) => {
                    return resolve()
                })
                    .then(() => {
                        document.addEventListener("keydown", (event) => {
                            if (event.ctrlKey || event.metaKey) {
                                if (isCtrlPressedA) {
                                    return;
                                }
                                isCtrlPressedA = true;
                                Archivement("", "没耐心", "我寻思我也没教过这个啊。")
                            }
                        });
                        return TouchCircleAndTime(836, 392, "#fefefe", "交互教程1", () => {
                            return new Promise((resolve, reject) => {
                                return resolve()
                            })
                                .then(() => {
                                    return TextBox(836, 392, 300, "交互教程1", ["恭喜你，点击了按钮。", "屏幕上的亮圆是交互按钮，用鼠标单击它即可打开对话框。"], "#010101", "#fefefe")
                                })
                                .then(([rect, text]) => {
                                    return WaitForClick(rect, text)
                                })
                                .then(() => {
                                    return TextBox(836, 292, 300, "交互教程1", ["这个方形的条是对话框。", "通常一个对话框中有多段文字，单击高亮的对话框就能使其继续。", "同时单击一个对话框能使其置顶，并使用边框高亮。为了方便，这里的对话框颜色变成了蓝色以便于你看的清楚。"], "#010101", "#09adff")
                                })
                                .then(([rect, text]) => {
                                    return WaitForClick(rect, text)
                                })
                                .then(() => {
                                    return TextBox(836, 192, 300, "交互教程1", ["有时候屏幕上会出现多个交互按钮。", "这代表着当前可以同时阅读多个文本。", "点击其中一个不会干扰其他交互的进行。", "在设置多个交互按钮之前，需要介绍左侧书签逻辑。"], "#010101", "#fefefe")
                                })
                                .then(([rect, text]) => {
                                    return WaitForClick(rect, text)
                                })
                                .then(() => {
                                    return TextBox(200, 50, 300, "交互教程1", ["我左边的便是书签按钮。", "它可能会变得非常多。", "有多少个书签，就代表着有多少个交互按钮和与之对应的演出。", "半透明的情况下即表示与之对应的演出尚未完成。", "而实色情况下则表示与之对应的演出已经完成。", "随着剧本的推进，书签会逐渐变多。", "无论什么情况下，您都可以点击它将它收起，这将会使屏幕上与之对应的演出组件（对话框、图片）暂时完全透明。", "您还可以再次点击，将演出组件重新显示。"], "#010101", "#fefefe")
                                })
                                .then(() => {
                                    return FinishTimeLine("交互教程1")
                                })
                        })
                    })
                    .then(() => {
                        Archivement("", "鼠标左键", "点击游戏小说大奖。")
                        return new Promise((resolve, reject) => {
                            return resolve()
                        })
                    })
                    .then(() => {
                        return Promise.all([
                            TouchCircleAndTime(200, 392, "#ff0000", "交互教程2", () => {
                                return new Promise((resolve, reject) => {
                                    return resolve()
                                })
                                    .then(() => {
                                        return TextBox(200, 392, 300, "交互教程2", ["您点击了红色按钮，这是左右侧同时出现的交互按钮的左边一个。"], "#fefefe", "#ff0000")
                                    })
                                    .then(([rect, text]) => {
                                        return WaitForClick(rect, text)
                                    })
                                    .then(() => {
                                        return TextBox(640, 360, 300, "交互教程2", ["现在它位于 640，360 的位置。"], "#fefefe", "#ff0000")
                                    })
                                    .then(([rect, text]) => {
                                        return WaitForClick(rect, text)
                                    })
                                    .then(() => {
                                        return TextBox(200, 392, 300, "交互教程2", ["文字框交叠，您点击了红色对话框并将其置顶。"], "#fefefe", "#ff0000")
                                    })
                                    .then(([rect, text]) => {
                                        return WaitForClick(rect, text)
                                    })
                                    .then(() => {
                                        return FinishTimeLine("交互教程2")
                                    })
                                                                }),
                            TouchCircleAndTime(1480, 392, "#0000ff", "交互教程3", () => {
                                return new Promise((resolve, reject) => {
                                    return resolve()
                                })
                                    .then(() => {
                                        return TextBox(1180, 392, 300, "交互教程3", ["您点击了蓝色按钮，这是左右侧同时出现的交互按钮的右边一个。"], "#fefefe", "#0000ff")
                                    })
                                    .then(([rect, text]) => {
                                        return WaitForClick(rect, text)
                                    })
                                    .then(() => {
                                        return TextBox(648, 358, 300, "交互教程3", ["现在它位于 648，358 的位置。"], "#fefefe", "#0000ff")
                                    })
                                    .then(([rect, text]) => {
                                        return WaitForClick(rect, text)
                                    })
                                    .then(() => {
                                        return TextBox(1180, 392, 300, "交互教程3", ["文字框交叠，您点击了蓝色对话框并将其置顶。"], "#fefefe", "#0000ff")
                                    })
                                    .then(([rect, text]) => {
                                        return WaitForClick(rect, text)
                                    })
                                    .then(() => {
                                        return FinishTimeLine("交互教程3")
                                    })
                            })

                        ])
                    })
                    .then(() => {
                        return TouchCircleNewWindowKeep(400, 200, "#00ff8c", "新教程", "newpage.html")
                    })
                    .then(() => {
                        Archivement("", "叠叠乐", "有一种原始驱力的美。")
                        return new Promise((resolve, reject) => {
                            return resolve()
                        })
                        
                    })
            }

            Tutorial();
        </script>
    </body>
</html>
