<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>M9 和 A4 纸</title>
        <script src="../js/konva.js"></script>
        <script src="../js/touch.js?v=2611220726"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #000;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            #game {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                right: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            #game canvas {
                display: block;
                aspect-ratio: 19/10;
            }
            /* web version: phones */
            html, body { overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
            #game { position: fixed; height: 100dvh; }
            #rotate-note { position: fixed; inset: 0; z-index: 100000; display: none; align-items: center; justify-content: center; background: #000; color: #fff; font: 16px sans-serif; letter-spacing: 0.1em; }
        </style>
    </head>
    <body>
        <div id="game"></div>
        
        
        <script src="../js/game.js"></script>
        <script src="../js/fit.js?v=2611220726"></script>
        <script>
            JustLayer("M9A4", () => {
                return new Promise((resolve) => {
                    return resolve()
                })
                    .then(() => {
                        return Background("../assets/images/背景.png", 0)
                    })
                    .then(() => {
                        return TextBox(104, 105, 300, "M9A4", ["M9 在我旁边，他比我高一点，我揉着他绿色蓬松的卷发，他苦笑地看着我。", "我有那么一瞬间幻想过他是我的孩子，我的孩子能长这么高就好了。"], "#db820d", "#eee")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(120, 180, 300, "M9A4", ["「你真好。」我不由得说出口。"], "#db820d", "#eee")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(110, 270, 300, "M9A4", ["M9 的眼角翕动着扯下一滴悬挂在睫毛的泪水，他什么也没有说，他的灵魂应是在哪受了苦，无法表达。"], "#db820d", "#eee")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(128, 400, 300, "M9A4", ["我的抽屉里有一些 A4 纸，是软性电子纸发明出来之前的东西，它轻薄易破碎，并且不能修改已经写上去的痕迹。", "M9 要走过几张，说是要给他小孩画画玩。", "我留了零星几张在抽屉里存着，偶尔取用抽屉内别的东西时，看到它们颓丧地叠在一起。"], "#db820d", "#eee")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return FinishLayer("M9A4")
                    })
            })
                
        </script>
    </body>
</html>
