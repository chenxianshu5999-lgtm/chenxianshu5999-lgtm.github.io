<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>窄门</title>
        <script src="../js/konva.js"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #000;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            #game {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                right: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            #game canvas {
                display: block;
                aspect-ratio: 19/10;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>
        
        
        <script src="../js/game.js"></script>
        <script src="../js/fit.js"></script>
        <script>
            JustLayer("窄门", () => {
                return new Promise((resolve) => {
                    return resolve()
                })
                    .then(() => {
                        return Background("../assets/images/背景.png", 0)
                    })
                    .then(() => {
                        return TextBox(100, 150, 300, "窄门", ["仿若掀开纱帐看到惊醒的表情，果然还是放下纱，像是平常无事才勉强能安抚心灵。", "对于描述痛苦的语词、于痛苦链接的语词，都尽量不听到，听到了也立马从脑海里删除。", "我能立刻做到这样的事。", "现实中，我立马拿起马克杯开始喝水，并且来回搓着捏着手指。"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(100, 225, 300, "窄门", ["我冲着灰黄的天空发愣，回忆不起任何事物。", "M9 在我身边坐下。"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(459, 123, 300, "窄门", ["「我可能根本理解不了那些给我布置工作的人所说的话。为什么我要在这里工作，我根本追不上这个项目。」"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(561, 348, 300, "窄门", ["「您真的很不容易。」", "「我只能建议您——哪怕痛苦，也先把这种感觉留住。」"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(545, 458, 300, "窄门", ["「你明明知道我真正想要什么……」", "我忍着泪水夹起饭盒里凉掉的米饭送进嘴里。"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(554, 558, 300, "窄门", ["「很抱歉。」"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(557, 629, 300, "窄门", ["腐竹和芹菜在碗底，晚饭吃完了。"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(885, 634, 300, "窄门", ["「但我保证您会在这里想起一切。」"], "#fbae7e", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return FinishLayer("窄门")
                    })
            })
                
        </script>
    </body>
</html>
