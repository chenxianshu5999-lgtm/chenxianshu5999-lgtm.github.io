<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>A-2</title>
        <script src="../js/konva.js"></script>
        <script src="../js/touch.js?v=2611220726"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #000;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            #game {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                right: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            #game canvas {
                display: block;
                aspect-ratio: 19/10;
            }
            /* web version: phones */
            html, body { overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
            #game { position: fixed; height: 100dvh; }
            #rotate-note { position: fixed; inset: 0; z-index: 100000; display: none; align-items: center; justify-content: center; background: #000; color: #fff; font: 16px sans-serif; letter-spacing: 0.1em; }
        </style>
    </head>
    <body>
        <div id="game"></div>
        
        
        <script src="../js/game.js"></script>
        <script src="../js/fit.js?v=2611220726"></script>
        <script>
            JustLayer("母女", () => {
                return new Promise((resolve) => {
                    return resolve()
                })
                    .then(() => {
                        return Background("../assets/images/背景.png", 0)
                    })
                    .then(() => {
                        return TextBox(120, 100, 300, "母女", ["我不确定我有那么深爱着我的孩子。", "每天出门上班之前看到孩子的脸蛋还曾打起过十万分精神对抗世界，但这份热情随着时间和行走的距离让我拿不定形状了。", "寝食不安下，爱是什么来着？爱为什么给人勇气？", "我若是真的爱我的孩子和这个世界，那我为什么还在这个地方打工？", "为什么我的妈妈那么爱我却还是离开了？", "为什么在我妈妈去世之前，没有其他人关怀她？", "为什么我要生孩子？我连自己都没法爱……"], "#ef7ad0", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(132, 230, 300, "母女", ["好吧，换个角度想，爱自己还是太难了，我先爱上了周围的事物，或许之后也能爱上小孩，再在最后爱到自己身上，也许沿着这样的路线走就能到达？", "话说回来，老板爱自己么？老板爱自己的同时能爱一下周围的像我一样渺小的人么？……"], "#ef7ad0", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(234, 371, 300, "母女", ["所以我在工位上轻轻哭出来了，有了孩子我不得不去回忆任何母女关系的画面。", "那时我刚生完孩子回到公司，重新布置我的工位，香水、化妆品、水杯、湿纸巾、手帕、小猫摆件、暖水袋……", "每一件都像是我的化身，在我留下的使用痕迹间张扬着存在，我觉得它们放了一年有些许陈旧，还像会说话一样吵吵嚷嚷的。", "在我意识到不适而停止摆弄这些物品之后，扔掉了它们。", "在公司，对着空的纸盒子哭泣。"], "#ef7ad0", "#333")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return FinishLayer("母女")
                    })
            })
                
        </script>
    </body>
</html>
