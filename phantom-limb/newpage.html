<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>交互教程 — 新分支</title>
        <script src="js/konva.js"></script>
        <script src="js/touch.js?v=2611220726"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background-color: #000;
                overflow: hidden;
                width: 100vw;
                height: 100vh;
            }

            #game {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                right: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            #game canvas {
                display: block;
                aspect-ratio: 19/10;
            }
            /* web version: phones */
            html, body { overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
            #game { position: fixed; height: 100dvh; }
            #rotate-note { position: fixed; inset: 0; z-index: 100000; display: none; align-items: center; justify-content: center; background: #000; color: #fff; font: 16px sans-serif; letter-spacing: 0.1em; }
        </style>
    </head>
    <body>
        <div id="game"></div>
        
        
        <script src="js/game.js"></script>
        <script src="js/fit.js?v=2611220726"></script>
        <script>
            JustLayer("新教程", () => {
                return new Promise((resolve) => {
                    return resolve()
                })
                    .then(() => {
                        return TextBox(100, 100, 300, "新教程", ["这是新的浮动窗口。"], "#333", "#fff")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return TextBox(100, 150, 500, "新教程", ["这个窗口在结束后不会自动关闭，而是会继续保持。", "您可以继续点击该文本以结束教程。"], "#333", "#fff")
                    })
                    .then(([rect, text]) => {
                        return WaitForClick(rect, text)
                    })
                    .then(() => {
                        return FinishLayer("新教程")
                    })
            })
                
        </script>
    </body>
</html>
