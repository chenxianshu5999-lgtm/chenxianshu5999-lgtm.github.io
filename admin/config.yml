# 网站后台配置。
backend:
  name: github
  repo: chenxianshu5999-lgtm/chenxianshu5999-lgtm.github.io
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: site
    label: 网站
    files:
      - name: settings
        label: 基本设置
        file: content/settings.json
        fields:
          - { name: title, label: 网站标题, widget: string }
          - { name: description, label: 一句话简介（显示在首页标题下，也给搜索引擎）, widget: text, required: false }
          - { name: language, label: 语言, widget: select, options: [en, zh-CN, ja], default: en }
          - { name: accent, label: 标识色（左侧色条、按钮、链接）, widget: color, default: "#000000" }

      - name: gallery
        label: Gallery（画）
        file: content/gallery.json
        fields:
          - { name: intro, label: 页面顶部的一句话, widget: string, required: false }
          - name: works
            label: 作品（可添加、删除、拖动排序）
            widget: list
            required: false
            summary: "{{fields.title}} ({{fields.year}})"
            fields:
              - { name: image, label: 图片, widget: image }
              - { name: title, label: 标题, widget: string, required: false }
              - { name: category, label: "分类（Oil 油画 / Illustration 插图 / Sketch 速写 / Draft 草图 / Concept 概念）", widget: select, options: [Oil, Illustration, Sketch, Draft, Concept], default: Illustration, required: false }
              - { name: year, label: 年份, widget: string, required: false }
              - { name: medium, label: "材料（如 Oil on canvas）", widget: string, required: false }
              - { name: size, label: "尺寸（如 F60, 130.3 × 97 cm）", widget: string, required: false }
              - { name: description, label: 简介, widget: markdown, required: false }
              - { name: secret, label: 简介隐藏（点三下标题才显示）, widget: boolean, required: false }
              - { name: hidden, label: 暂时隐藏, widget: boolean, default: false, required: false }

      - name: books
        label: Books（本）
        file: content/books.json
        fields:
          - { name: intro, label: 页面顶部的一句话, widget: string, required: false }
          - name: items
            label: 本（可添加、删除、拖动排序）
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: cover, label: 封面, widget: image, required: false }
              - { name: title, label: 书名, widget: string }
              - { name: year, label: 年份, widget: string, required: false }
              - { name: format, label: "形式（如 PDF, 24 pages）", widget: string, required: false }
              - { name: description, label: 简介, widget: markdown, required: false }
              - { name: link, label: 购买/阅读链接, widget: string, required: false }
              - { name: link_label, label: "按钮文字（默认 Get this book）", widget: string, required: false }
              - { name: reader, label: "在线阅读编号（对应 books/ 下的文件夹，一般不用改）", widget: string, required: false }
              - { name: hidden, label: 暂时隐藏, widget: boolean, default: false, required: false }

      - name: screening
        label: Screening Room（放映厅）
        file: content/screening.json
        fields:
          - { name: title, label: 页面标题, widget: string, default: Screening Room }
          - { name: intro, label: 标题下的一句话, widget: string, required: false }
          - name: films
            label: 影片（可添加、删除、拖动排序）
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: video, label: "视频文件（mp4，100MB 以内）", widget: file, required: false }
              - { name: poster, label: 封面图（播放前显示）, widget: image, required: false }
              - { name: title, label: 标题, widget: string, required: false }
              - { name: year, label: 年份, widget: string, required: false }
              - { name: length, label: 时长, widget: string, required: false }
              - { name: medium, label: 媒介, widget: string, required: false }
              - { name: description, label: 简介, widget: markdown, required: false }
              - { name: hidden, label: 暂时隐藏, widget: boolean, default: false, required: false }

      - name: t0
        label: 隐藏页 T0（一张大图 + 台词条）
        file: content/t0.json
        fields:
          - { name: image, label: 大图, widget: image, required: false }
          - name: lines
            label: 台词条（可添加、删除、拖动排序）
            widget: list
            required: false
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: 台词, widget: text }
              - { name: x, label: "左边位置（占图宽的百分比，0–100）", widget: number, value_type: float, default: 10 }
              - { name: y, label: "上边位置（占图高的百分比，0–100）", widget: number, value_type: float, default: 10 }
              - { name: w, label: "宽度（占图宽的百分比）", widget: number, value_type: float, default: 25 }
              - { name: bg, label: "底色（如 #c9d62a）", widget: string, required: false }
              - { name: color, label: "字色（如 #111111）", widget: string, required: false }
              - { name: dot, label: "圆点颜色（留空则同底色）", widget: string, required: false }
              - { name: after, label: 等上一条读完才出现圆点, widget: boolean, default: false, required: false }
              - name: then
                label: 接续台词（点完上一条后出现在它下方）
                widget: list
                required: false
                summary: "{{fields.text}}"
                fields:
                  - { name: text, label: 台词, widget: text }
                  - { name: dx, label: "向右错开（百分比）", widget: number, value_type: float, required: false }
                  - { name: gap, label: "与上一条的间距（百分比）", widget: number, value_type: float, required: false }
              - { name: hidden, label: 暂时隐藏, widget: boolean, default: false, required: false }

      - name: shop
        label: Shop（环形塔物贩协会）
        file: content/shop.json
        fields:
          - { name: title, label: 页面标题, widget: string, default: 环形塔物贩协会 }
          - { name: intro, label: 标题下的一句话, widget: string, required: false }
          - { name: url, label: 微店店铺网址, widget: string, required: false }
          - name: items
            label: 在售商品（可添加、删除、拖动排序）
            widget: list
            required: false
            summary: "{{fields.name}} {{fields.price}}"
            fields:
              - { name: image, label: 商品图, widget: image, required: false }
              - { name: name, label: 商品名, widget: string }
              - { name: price, label: "价格（如 ¥35）", widget: string, required: false }
              - { name: status, label: "状态（如 Pre-order, Sold out，可留空）", widget: string, required: false }
              - { name: link, label: 这件商品的微店链接（留空则跳到店铺）, widget: string, required: false }
              - { name: hidden, label: 暂时隐藏（下架时勾上）, widget: boolean, default: false, required: false }

      - name: demo
        label: Phantom Limb（幻肢 demo）
        file: content/demo.json
        fields:
          - { name: title, label: 标题, widget: string, default: Phantom Limb }
          - { name: tagline, label: 标题下的一句话, widget: string, required: false }
          - { name: description, label: 介绍, widget: markdown, required: false }
          - { name: url, label: "demo 链接（文件放进 phantom-limb 文件夹后填 phantom-limb/）", widget: string, required: false }
          - { name: cover, label: 封面图, widget: image, required: false }
          - { name: note, label: "小字备注（如 Chinese only, best on desktop）", widget: string, required: false }

      - name: music
        label: 音乐栏（右上角）
        file: content/music.json
        fields:
          - { name: autoplay, label: 打开网站时自动播放, widget: boolean, default: true, required: false }
          - { name: shuffle, label: 随机顺序, widget: boolean, default: false, required: false }
          - name: tracks
            label: 曲目（可添加、删除、拖动排序）
            widget: list
            required: false
            summary: "{{fields.title}} / {{fields.artist}}"
            fields:
              - { name: title, label: 曲名, widget: string }
              - { name: artist, label: 作者, widget: string, required: false }
              - { name: file, label: "音频文件（mp3 / m4a / ogg）", widget: file }
              - { name: hidden, label: 暂时隐藏, widget: boolean, default: false, required: false }

      - name: telescope
        label: 隐藏页 氕叶斯太空望远镜（放映界面）
        file: content/telescope.json
        fields:
          - { name: title, label: 页面标题, widget: string, required: false }
          - { name: label, label: "屏幕上方的小字", widget: string, required: false }
          - { name: intro, label: 标题下的一句话, widget: string, required: false }
          - { name: video, label: "视频文件（mp4，100MB 以内；也可填外部链接）", widget: file, required: false }
          - { name: poster, label: 封面图（播放前显示）, widget: image, required: false }
          - { name: ratio, label: "画面比例（如 1.778 = 16:9；不填就是 16:9）", widget: number, value_type: float, required: false }
          - { name: target, label: "Target（观测目标）", widget: string, required: false }
          - { name: band, label: "Band（波段）", widget: string, required: false }
          - { name: received, label: "Received（接收时间）", widget: string, required: false }

      - name: registry
        label: Register（隐藏页：莫比斯小机构登记列表）
        file: content/registry.json
        fields:
          - { name: title, label: 页面标题, widget: string, required: false }
          - { name: intro, label: 标题下的一句话, widget: string, required: false }
          - name: entries
            label: 登记条目（可添加、删除、拖动排序）
            widget: list
            required: false
            summary: "{{fields.name}} ({{fields.status}})"
            fields:
              - { name: name, label: 名称, widget: string }
              - { name: status, label: "状态（Registered 已登记未开工 / Under construction 制作中 / Open 已做完 / Closed 不做了）", widget: select, options: [Registered, Under construction, Open, Closed], default: Registered }
              - { name: kind, label: "类别（可不填，如 committee、club）", widget: string, required: false }
              - { name: note, label: 备注, widget: text, required: false }
              - { name: link, label: "链接（填了以后名称可以点击跳转）", widget: string, required: false }
              - { name: no, label: "编号（不填就按顺序自动编 001、002…）", widget: string, required: false }
              - { name: hidden, label: 暂时隐藏, widget: boolean, default: false, required: false }

      - name: home
        label: 首页文字
        file: content/home.json
        fields:
          - name: sections
            label: 文字段落（可添加、删除、拖动排序）
            widget: list
            required: false
            typeKey: type
            types:
              - name: text
                label: 文字
                fields:
                  - { name: title, label: 小标题, widget: string, required: false }
                  - { name: body, label: 正文, widget: markdown, required: false }
                  - { name: hidden, label: 暂时隐藏, widget: boolean, default: false, required: false }

      - name: menu
        label: 外部链接
        file: content/menu.json
        fields:
          - name: items
            label: 链接（显示在左侧栏底部，如 Instagram、BOOTH）
            widget: list
            required: false
            fields:
              - { name: label, label: 显示文字, widget: string }
              - { name: link, label: 网址, widget: string }
